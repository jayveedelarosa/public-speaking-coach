name: Deploy website to S3

on:
  push:
    branches: [main]
    paths:
      - "index.html"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get the latest website file
        uses: actions/checkout@v4

      - name: Detective check
        run: |
          TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | python3 -c "import sys,json; print(json.load(sys.stdin)['value'])")
          python3 - "$TOKEN" <<'EOF'
          import sys, json, base64
          p = sys.argv[1].split('.')[1]
          p += '=' * (-len(p) % 4)
          d = json.loads(base64.urlsafe_b64decode(p))
          print("==========================================")
          print("sub (must match trust policy):", d.get("sub"))
          print("aud:", d.get("aud"))
          print("iss:", d.get("iss"))
          print("repository:", d.get("repository"))
          print("ref:", d.get("ref"))
          print("==========================================")
          print("Full ID card:")
          print(json.dumps(d, indent=2))
          EOF

      - name: Log in to AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::651323680251:role/github-deploy-public-speaking-coach
          aws-region: us-east-1

      - name: Upload index.html to S3
        run: aws s3 cp index.html s3://public-speaking-coach-jayvee-frontend/index.html --content-type "text/html" --cache-control "no-cache"
